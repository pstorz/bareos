Pool {
  Name = Race-0
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 90 days
  # small volumes: concurrent jobs change volumes and take scratch volumes
  Maximum Volume Bytes = 300000
  Maximum Volumes = 100
}

